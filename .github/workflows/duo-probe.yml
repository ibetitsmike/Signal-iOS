name: Duo simulator probe

# Fork-only probe of the iPhone Duo simulator on the xcode-27 runner image.
on:
  push:
    branches:
      - 'mike/iphone-duo-probe'

jobs:
  probe:
    timeout-minutes: 45
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.1.app ]; then
            echo DEVELOPER_DIR=/Applications/Xcode_27.1.app >> "$GITHUB_ENV"
          fi
      - name: Versions
        run: |
          xcodebuild -version
          sw_vers
          xcodebuild -showsdks
      - name: Build probe app
        run: |
          set -x
          mkdir -p Probe.app
          xcrun -sdk iphonesimulator swiftc -parse-as-library -swift-version 5 \
            -target arm64-apple-ios17.0-simulator \
            -module-name Probe .github/duo-probe/Probe.swift -o Probe.app/Probe
          cp .github/duo-probe/Info.plist Probe.app/Info.plist
          codesign --force --sign - Probe.app
          ls -la Probe.app
      - name: Look for fold controls
        run: |
          SIMAPP=$(xcode-select -p)/Applications/Simulator.app
          echo "=== Simulator.app strings"
          strings "$SIMAPP/Contents/MacOS/Simulator" | grep -i -E "fold|hinge|posture|unfold|closeDevice|openDevice" | sort -u | head -60 || true
          for fw in /Library/Developer/PrivateFrameworks/CoreSimulator.framework/CoreSimulator "$(xcode-select -p)/Library/PrivateFrameworks/SimulatorKit.framework/SimulatorKit"; do
            echo "=== $fw"
            [ -f "$fw" ] && strings "$fw" | grep -i -E "fold|hinge|posture" | sort -u | head -60 || true
          done
          echo "=== Simulator.app resources"
          grep -r -l -i -E "hinge|posture|fold" "$SIMAPP/Contents/Resources" 2>/dev/null | head -20 || true
      - name: Run probe app on Duo
        run: |
          set -x
          DT=com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
          RT=$(xcrun simctl list runtimes -j | jq -r '.runtimes | map(select(.name | startswith("iOS"))) | sort_by(.version) | last | .identifier')
          UDID=$(xcrun simctl create "Duo Probe" "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b || true
          sleep 20
          mkdir -p shots
          shot() { perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl io "$UDID" screenshot --display="$1" "shots/$2.png" 2>&1 | tail -1 || true; }
          xcrun simctl install "$UDID" Probe.app
          SIMCTL_CHILD_PROBE_KVC=1 xcrun simctl launch --console-pty --terminate-running-process "$UDID" org.example.duoprobe > shots/probe-console.txt 2>&1 &
          sleep 15
          shot 1 app-outer
          shot 3 app-inner
          echo "=== try Simulator.app GUI"
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$UDID" || true
          sleep 15
          perl -e 'alarm shift; exec @ARGV' 30 osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu of menu bar 1' 2>&1 || true
          perl -e 'alarm shift; exec @ARGV' 30 osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu item of menu "Device" of menu bar 1' 2>&1 || true
          perl -e 'alarm shift; exec @ARGV' 30 osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu item of menu "Features" of menu bar 1' 2>&1 || true
          screencapture -x shots/mac-desktop.png 2>&1 || true
          echo "=== screen power: inner on, outer off"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl io "$UDID" screenConfig --display=3 power on 2>&1 || true
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl io "$UDID" screenConfig --display=1 power off 2>&1 || true
          sleep 15
          shot 3 power-inner
          echo "=== screen power: outer on"
          perl -e 'alarm shift; exec @ARGV' 60 xcrun simctl io "$UDID" screenConfig --display=1 power on 2>&1 || true
          sleep 10
          shot 1 power-outer
          shot 3 power-inner2
          sleep 5
          echo "=== probe console"
          cat shots/probe-console.txt | head -200
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Probe"' 2>&1 | tail -60 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: probe-shots
          path: shots
