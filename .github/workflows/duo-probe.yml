name: Duo simulator probe

# Fork-only probe of the iPhone Duo simulator on the xcode-27 runner image.
on:
  push:
    branches:
      - 'mike/iphone-duo-probe'

jobs:
  probe:
    timeout-minutes: 45
    runs-on: xcode-27
    steps:
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.1.app ]; then
            echo DEVELOPER_DIR=/Applications/Xcode_27.1.app >> "$GITHUB_ENV"
          fi
      - name: Versions
        run: |
          xcodebuild -version
          sw_vers
          xcodebuild -showsdks
      - name: Simulator inventory
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devicetypes
          xcrun simctl list devices available
      - name: simctl help
        run: |
          xcrun simctl help 2>&1 || true
          for c in io ui hinge posture fold display; do echo "=== simctl help $c"; xcrun simctl help $c 2>&1 | head -60 || true; done
      - name: Duo device type profile
        run: |
          find / -name "*Duo*.simdevicetype" -maxdepth 12 2>/dev/null | head -5 || true
          P=$(find / -name "*Duo*.simdevicetype" -maxdepth 12 2>/dev/null | head -1)
          if [ -n "$P" ]; then
            ls -R "$P" | head -50
            for f in "$P"/Contents/Resources/profile.plist "$P"/Contents/Info.plist "$P"/Contents/Resources/capabilities.plist; do
              echo "=== $f"; [ -f "$f" ] && plutil -convert xml1 -o - "$f" | head -300
            done
          fi
      - name: Boot Duo and screenshot
        run: |
          set -x
          DT=com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
          RT=$(xcrun simctl list runtimes -j | jq -r '.runtimes | map(select(.name | startswith("iOS"))) | sort_by(.version) | last | .identifier')
          UDID=$(xcrun simctl create "Duo Probe" "$DT" "$RT")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 30
          mkdir -p shots
          shot() { xcrun simctl io "$UDID" screenshot --display="$1" "shots/$2.png" 2>&1 | tail -2 || true; }
          shot 1 boot-outer
          shot 3 boot-inner
          echo "=== power off inner (fold?)"
          xcrun simctl io "$UDID" screenConfig --display=3 power off 2>&1 || true
          sleep 10
          xcrun simctl io "$UDID" enumerate 2>&1 | grep -E "Power state|Default (width|height)" || true
          shot 1 folded-outer
          shot 3 folded-inner
          echo "=== power on inner, power off outer (unfold?)"
          xcrun simctl io "$UDID" screenConfig --display=3 power on 2>&1 || true
          xcrun simctl io "$UDID" screenConfig --display=1 power off 2>&1 || true
          sleep 10
          xcrun simctl io "$UDID" enumerate 2>&1 | grep -E "Power state|Default (width|height)" || true
          shot 1 unfolded-outer
          shot 3 unfolded-inner
          echo "=== geometry probe"
          xcrun simctl io "$UDID" screenConfig --display=3 2>&1 | head -20 || true
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'eventMessage CONTAINS[c] "hinge" OR eventMessage CONTAINS[c] "fold" OR eventMessage CONTAINS[c] "posture"' 2>&1 | tail -40 || true
          ls -la shots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: probe-shots
          path: shots
